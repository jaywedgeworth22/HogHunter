name: HogHunter

options:
  bundleIdPrefix: com.jayservices
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  HogHunter:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayservices.HogHunter
        PRODUCT_NAME: HogHunter
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Jay Wedgeworth"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: HogHunter.entitlements

  HogHunterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HogHunterTests
    dependencies:
      - target: HogHunter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jayservices.HogHunterTests

schemes:
  HogHunter:
    build:
      targets:
        HogHunter: all
        HogHunterTests: [test]
    test:
      targets:
        - HogHunterTests
