name: HogHunter

options:
  bundleIdPrefix: com.jayservices
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  HogHunter:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - sdk: ServiceManagement.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayservices.HogHunter
        PRODUCT_NAME: HogHunter
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Jay Wedgeworth"
        COMBINE_HIDPI_IMAGES: YES
